name: core-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q ros2_runtime_guardian tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Deterministic replay
        run: python -m ros2_runtime_guardian replay examples/traces/node_stall.jsonl

